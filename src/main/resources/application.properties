spring.application.name=air-freight
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8380/realms/airfreight}
spring.security.oauth2.resourceserver.jwt.audiences=airfreight-api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5443/postgres}
spring.datasource.username=${DATABASE_USERNAME:user}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.sql.init.mode=always
# Sample data is opt-in through the local profile.
spring.sql.init.data-locations=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:password}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.staleness.published=1m
spring.modulith.events.staleness.processing=5m
spring.modulith.events.staleness.resubmitted=1m
spring.task.execution.pool.core-size=1

# Enable after the Load contributor supplies LoadPlanningApi's implementation.
airfreight.feeds.cargo.enabled=false
